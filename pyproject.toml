[tool.pytest.ini_options]
testpaths = ["Tests"]
pythonpath = ["."]

[tool.pyrefly]
project-includes = ["P_Bits", "Tests"]
project-excludes = [
    "**/Data/", "**/Figures/", "**/Notes/", "**/Hardware/",
    "**/Analysis/", "**/Experiments/", "**/Documents/",
]
python-version = "3.14.0"
preset = "strict"
replace-untyped-imports-with-any = ["sympy.*"]

[tool.pyrefly.errors]
unannotated-return = "error"
no-any-return = "error"
unused-type-ignore = "error"
